<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Resolution</title>
    <meta name="description" content="Centralized omnichannel customer complaint resolution management platform with multi-channel registration, ticket assignment, SLA monitoring, escalation workflows, and customer feedback.">
    <meta property="og:title" content="Nexus Resolution">
    <meta property="og:description" content="Centralized omnichannel customer complaint resolution management platform with multi-channel registration, ticket assignment, SLA monitoring, escalation workflows, and customer feedback.">
    <meta property="og:type" content="website">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React 18, React-DOM, & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Clean custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printable-ticket-slip, #printable-ticket-slip * {
                visibility: visible;
            }
            #printable-ticket-slip {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                border: none !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 overflow-hidden">
    <div id="root">
        <!-- Initial skeleton loading screen until React mounts -->
        <div class="h-screen flex items-center justify-center bg-slate-50">
            <div class="text-center space-y-3">
                <div class="w-12 h-12 border-4 border-blue-700 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-xs font-bold text-slate-600 tracking-wider uppercase">Loading Nexus Resolution Omnichannel Platform...</p>
            </div>
        </div>
    </div>

    <!-- Application Modules -->
    <script type="text/babel" src="/modals.js"></script>
    <script type="text/babel" src="/views.js"></script>
    <script type="text/babel" src="/app.js"></script>
</body>
</html>
