        function AdjustCompensationModal({ ticket, hrUser, onClose, onSuccess, onProceedToDisburse, showToast }) {
            const rawClaimed = ticket.originalClaimedAmount || ticket.claimedAmount || (() => {
                const match = (ticket.description || '').match(/(?:₹|Rs\.?|INR)\s*([\d,]+)/i);
                return match ? `₹${match[1]}` : null;
            })() || (ticket.resolvedAmount && ticket.resolvedAmount.startsWith('₹') ? ticket.resolvedAmount : null);

            const claimedNum = parseFloat(String(rawClaimed || '').replace(/[^0-9.]/g, '')) || 0;

            const initialAmount = (() => {
                if (ticket.hrApprovedAmount) {
                    const clean = ticket.hrApprovedAmount.replace(/[^0-9.]/g, '');
                    if (clean && !isNaN(clean)) return clean;
                }
                if (ticket.resolvedAmount) {
                    const clean = ticket.resolvedAmount.replace(/[^0-9.]/g, '');
                    if (clean && !isNaN(clean)) return clean;
                }
                if (claimedNum > 0) return String(claimedNum);
                return '14800';
            })();

            const [amount, setAmount] = useState(initialAmount);
            const [presetReason, setPresetReason] = useState(
                ticket.amountAdjustmentReason || 'Employee inflated/increased amount unwantedly (Deducted unauthorized charges)'
            );
            const [customReason, setCustomReason] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [amount]);

            const currentNum = parseFloat(String(amount).replace(/[^0-9.]/g, '')) || 0;
            const isAdjusted = claimedNum > 0 && Math.abs(currentNum - claimedNum) > 0.01;
            const isReduced = isAdjusted && currentNum < claimedNum;
            const diffAmount = Math.abs(currentNum - claimedNum);

            const handleSave = async (andDisburse = false) => {
                if (!amount || isNaN(parseFloat(amount)) || parseFloat(amount) <= 0) {
                    showToast('Please enter a valid positive numeric compensation amount', 'error');
                    return;
                }

                const finalReason = customReason.trim() || presetReason;
                setIsSubmitting(true);

                try {
                    const res = await apiCall(`/complaints/${ticket.id}/adjust-amount`, {
                        method: 'POST',
                        body: JSON.stringify({
                            newAmount: parseFloat(amount),
                            adjustmentReason: finalReason,
                            hrName: hrUser.fullName,
                            hrEmployeeId: hrUser.employeeId
                        })
                    });

                    setIsSubmitting(false);
                    if (andDisburse) {
                        onProceedToDisburse(res);
                    } else {
                        onSuccess(res);
                    }
                } catch (err) {
                    setIsSubmitting(false);
                    showToast('Failed to adjust compensation amount: ' + err.message, 'error');
                }
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl border border-slate-200 my-8">
                        {/* Header */}
                        <div className="flex items-start justify-between border-b border-slate-100 pb-4 mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center">
                                    <i data-lucide="sliders" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h3 className="text-base font-bold text-slate-900">Adjust & Sanction Compensation Amount</h3>
                                    <p className="text-xs text-slate-500">Ticket {ticket.ticketNumber} • {ticket.customerName} ({ticket.employeeId})</p>
                                </div>
                            </div>
                            <button
                                onClick={onClose}
                                className="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-100 transition"
                            >
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {/* Subject info */}
                        <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4 text-xs">
                            <p className="text-slate-500 font-medium">Grievance Subject:</p>
                            <p className="font-semibold text-slate-800 mt-0.5">{ticket.subject}</p>
                        </div>

                        {/* Comparison Box */}
                        <div className="bg-amber-50/80 border border-amber-200 rounded-xl p-3.5 mb-4 space-y-2">
                            <div className="flex items-center justify-between text-xs">
                                <span className="text-slate-600">Employee Claimed Amount:</span>
                                <span className="font-mono font-bold text-slate-800 text-sm">
                                    {claimedNum > 0 ? `₹${claimedNum.toLocaleString('en-IN')}` : (ticket.claimedAmount || 'Not specified')}
                                </span>
                            </div>
                            <div className="flex items-center justify-between text-xs">
                                <span className="text-slate-600">HR Sanctioned Amount:</span>
                                <span className="font-mono font-black text-emerald-700 text-sm">
                                    ₹{currentNum.toLocaleString('en-IN')}
                                </span>
                            </div>

                            {isAdjusted && (
                                <div className={`p-2 rounded-lg text-xs font-semibold flex items-center justify-between ${
                                    isReduced ? 'bg-amber-100 text-amber-900' : 'bg-blue-100 text-blue-900'
                                }`}>
                                    <span>
                                        <i data-lucide={isReduced ? "shield-alert" : "info"} className="w-3.5 h-3.5 inline mr-1"></i>
                                        {isReduced ? `Anti-Inflation Reduction: -₹${diffAmount.toLocaleString('en-IN')} deducted` : `Revised: +₹${diffAmount.toLocaleString('en-IN')}`}
                                    </span>
                                    <span className="font-mono text-[11px]">
                                        {claimedNum > 0 ? `${Math.round((currentNum / claimedNum) * 100)}% of Claim` : ''}
                                    </span>
                                </div>
                            )}
                        </div>

                        {/* Amount Input */}
                        <div className="space-y-3 mb-4">
                            <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                                New Approved Amount (₹) *
                            </label>
                            <div className="relative">
                                <span className="absolute left-3.5 top-2.5 font-bold text-sm text-slate-500">₹</span>
                                <input
                                    type="number"
                                    required
                                    min="1"
                                    step="any"
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    placeholder="Enter verified compensation amount"
                                    className="w-full pl-8 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-mono text-sm text-slate-900 font-bold focus:outline-none focus:bg-white focus:border-amber-600"
                                />
                            </div>

                            {/* Quick Presets */}
                            {claimedNum > 0 && (
                                <div className="flex flex-wrap items-center gap-1.5">
                                    <span className="text-[10px] text-slate-400 font-semibold uppercase">Quick Caps:</span>
                                    <button
                                        type="button"
                                        onClick={() => setAmount(String(claimedNum))}
                                        className="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[10px] font-medium"
                                    >
                                        Full Claim (100%)
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAmount(String(Math.round(claimedNum * 0.75)))}
                                        className="px-2 py-0.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-md text-[10px] font-semibold"
                                    >
                                        75% Cap (₹{Math.round(claimedNum * 0.75).toLocaleString('en-IN')})
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAmount(String(Math.round(claimedNum * 0.5)))}
                                        className="px-2 py-0.5 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 rounded-md text-[10px] font-semibold"
                                    >
                                        50% Cap (₹{Math.round(claimedNum * 0.5).toLocaleString('en-IN')})
                                    </button>
                                    {claimedNum > 5000 && (
                                        <button
                                            type="button"
                                            onClick={() => setAmount(String(Math.max(1000, claimedNum - 5000)))}
                                            className="px-2 py-0.5 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 rounded-md text-[10px] font-semibold"
                                        >
                                            -₹5,000 Unverified
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Reason / Justification */}
                        <div className="space-y-2 mb-6">
                            <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                                Reason for Overriding Amount (Audit Log Justification) *
                            </label>
                            <select
                                value={presetReason}
                                onChange={(e) => setPresetReason(e.target.value)}
                                className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:bg-white focus:border-amber-600"
                            >
                                <option value="Employee inflated/increased amount unwantedly (Deducted unauthorized charges)">
                                    Employee inflated/increased amount unwantedly (Deducted unauthorized charges)
                                </option>
                                <option value="Exceeds corporate reimbursement ceiling for employee grade">
                                    Exceeds corporate reimbursement ceiling for employee grade
                                </option>
                                <option value="Deducted non-reimbursable personal expenses and duplicate bills">
                                    Deducted non-reimbursable personal expenses and duplicate bills
                                </option>
                                <option value="Missing proof of purchase / partial receipt substantiation">
                                    Missing proof of purchase / partial receipt substantiation
                                </option>
                                <option value="Statutory tax/PF reconciliation adjustment applied">
                                    Statutory tax/PF reconciliation adjustment applied
                                </option>
                                <option value="Mutually agreed final revised settlement">
                                    Mutually agreed final revised settlement
                                </option>
                                <option value="Other HR audit determination">
                                    Other HR audit determination (Specify below)
                                </option>
                            </select>
                            <input
                                type="text"
                                value={customReason}
                                onChange={(e) => setCustomReason(e.target.value)}
                                placeholder="Detailed note (e.g., Deducted ₹10,500 unapproved business-class travel upgrade)"
                                className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:bg-white focus:border-amber-600"
                            />
                            <p className="text-[10px] text-slate-400">
                                This will be logged in the immutable audit trail and visible to the employee on their resolution statement.
                            </p>
                        </div>

                        {/* Actions */}
                        <div className="flex items-center justify-end gap-2 border-t border-slate-100 pt-4">
                            <button
                                type="button"
                                onClick={onClose}
                                disabled={isSubmitting}
                                className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition"
                            >
                                Cancel
                            </button>
                            <button
                                type="button"
                                onClick={() => handleSave(false)}
                                disabled={isSubmitting}
                                className="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl transition shadow-xs flex items-center gap-1.5"
                            >
                                <i data-lucide="check" className="w-3.5 h-3.5"></i>
                                {isSubmitting ? 'Saving...' : 'Save Adjusted Amount'}
                            </button>
                            <button
                                type="button"
                                onClick={() => handleSave(true)}
                                disabled={isSubmitting}
                                className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl transition shadow-xs flex items-center gap-1.5"
                            >
                                <i data-lucide="credit-card" className="w-3.5 h-3.5"></i>
                                Save & Proceed to Disburse
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 8. TICKET DETAIL MODAL (Light Theme)
        // ==========================================
        function TicketDetailModal({ ticket, user, onClose, onDownload, onTakeAction, onCompensate, onAdjustAmount, showToast, loadData }) {
            const [replyMsg, setReplyMsg] = useState('');
            const [isSending, setIsSending] = useState(false);

            const handleSendReply = async (e) => {
                e.preventDefault();
                if (!replyMsg.trim()) return;

                setIsSending(true);
                try {
                    await apiCall(`/complaints/${ticket.id}/reply`, {
                        method: 'POST',
                        body: JSON.stringify({
                            message: replyMsg,
                            senderName: user.fullName,
                            senderEmail: user.email,
                            isInternal: false
                        })
                    });
                    setReplyMsg('');
                    setIsSending(false);
                    showToast('Reply message added to ticket thread');
                    loadData();
                } catch (err) {
                    setIsSending(false);
                    alert("Error replying: " + err.message);
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
                    <div className="bg-white text-slate-900 w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-8 max-h-[90vh] flex flex-col">
                        <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
                            <div>
                                <span className="font-mono text-xs font-bold text-blue-700">{ticket.ticketNumber}</span>
                                <h3 className="font-bold text-sm text-slate-900">{ticket.subject}</h3>
                            </div>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scrollbar space-y-4 text-xs flex-1">
                            {/* Summary info */}
                            <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
                                <div>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase">Complainant</p>
                                    <p className="font-bold text-slate-900 text-xs mt-0.5">{ticket.customerName} ({ticket.employeeId})</p>
                                    <p className="text-slate-500">{ticket.customerEmail}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase">Assigned Officer & Status</p>
                                    <p className="font-bold text-slate-900 text-xs mt-0.5">{ticket.assignedAgentName || 'Priya'}</p>
                                    <p className="text-emerald-700 font-bold">{ticket.status} • {ticket.priority} Priority</p>
                                </div>
                            </div>

                            <div>
                                <p className="text-[10px] text-slate-400 font-bold uppercase mb-1">Grievance Description</p>
                                <p className="text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200 leading-relaxed">
                                    {ticket.description}
                                </p>
                            </div>

                            {/* Financial Claim & HR Compensation Audit Box */}
                            <div className={`p-3.5 rounded-xl border space-y-2 ${
                                ticket.isAmountAdjusted ? 'bg-amber-50/70 border-amber-300' : 'bg-slate-50 border-slate-200'
                            }`}>
                                <div className="flex items-center justify-between">
                                    <span className="text-[10px] font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
                                        <i data-lucide="sliders" className="w-3.5 h-3.5 text-amber-600"></i>
                                        Financial Claim & Compensation Audit
                                    </span>
                                    {ticket.isAmountAdjusted ? (
                                        <span className="px-2 py-0.5 bg-amber-200 text-amber-900 rounded font-bold text-[10px]">
                                            HR REVISED AMOUNT
                                        </span>
                                    ) : (
                                        <span className="text-[10px] text-slate-500">Standard Claim</span>
                                    )}
                                </div>

                                <div className="grid grid-cols-2 gap-3 pt-1">
                                    <div>
                                        <span className="text-[10px] text-slate-500 font-medium">Employee Claimed:</span>
                                        <p className={`font-mono font-bold ${ticket.isAmountAdjusted ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                            {ticket.originalClaimedAmount || ticket.claimedAmount || 'Not specified'}
                                        </p>
                                    </div>
                                    <div>
                                        <span className="text-[10px] text-slate-500 font-medium">HR Sanctioned / Settled:</span>
                                        <p className="font-mono font-black text-emerald-700 text-sm">
                                            {ticket.hrApprovedAmount || ticket.resolvedAmount || (ticket.compensationPayment ? ticket.compensationPayment.amount : 'Pending Audit')}
                                        </p>
                                    </div>
                                </div>

                                {ticket.isAmountAdjusted && (
                                    <div className="bg-white/80 p-2.5 rounded-lg border border-amber-200 text-[11px] space-y-0.5">
                                        <span className="text-[10px] font-bold text-amber-900 uppercase">Reason for HR Amount Override:</span>
                                        <p className="text-amber-950 font-medium">{ticket.amountAdjustmentReason || 'Deduction of inflated or unauthorized charges per company policy'}</p>
                                    </div>
                                )}

                                {user && user.role === 'HR' && ticket.status !== 'RESOLVED' && onAdjustAmount && (
                                    <div className="pt-1 flex justify-end">
                                        <button
                                            type="button"
                                            onClick={onAdjustAmount}
                                            className="px-2.5 py-1 bg-white hover:bg-amber-50 text-amber-800 font-bold border border-amber-300 rounded-lg text-xs transition inline-flex items-center gap-1 shadow-2xs"
                                        >
                                            <i data-lucide="sliders" className="w-3 h-3 text-amber-700"></i>
                                            {ticket.isAmountAdjusted ? 'Re-adjust Approved Amount' : 'Override / Adjust Claim Amount'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            {ticket.actionNotes && (
                                <div>
                                    <p className="text-[10px] text-blue-800 font-bold uppercase mb-1">Investigation Action Taken</p>
                                    <p className="text-slate-800 bg-blue-50/50 p-3 rounded-lg border border-blue-200 leading-relaxed font-medium">
                                        {ticket.actionNotes}
                                    </p>
                                    {ticket.resolvedAmount && (
                                        <p className="text-emerald-700 font-bold mt-1 text-[11px]">Financial Settlement: {ticket.resolvedAmount}</p>
                                    )}
                                </div>
                            )}

                            {ticket.compensationPayment && (
                                <div className="bg-emerald-50 border border-emerald-300 rounded-xl p-3.5 space-y-1.5">
                                    <div className="flex items-center justify-between">
                                        <span className="font-bold text-emerald-900 flex items-center gap-1.5 text-xs">
                                            <i data-lucide="check-circle" className="w-4 h-4 text-emerald-600"></i>
                                            Corporate Compensation Disbursed: {ticket.compensationPayment.amount}
                                        </span>
                                        <span className="px-2 py-0.5 bg-emerald-700 text-white rounded text-[10px] font-mono font-bold">
                                            UTR: {ticket.compensationPayment.transactionId}
                                        </span>
                                    </div>
                                    <p className="text-slate-600 text-[11px]">
                                        Disbursed by {ticket.compensationPayment.paidBy} via {ticket.compensationPayment.paymentMethod} to account {ticket.compensationPayment.beneficiaryAccount} on {ticket.compensationPayment.paidAt}.
                                    </p>
                                </div>
                            )}

                            {/* Reply Input */}
                            <form onSubmit={handleSendReply} className="pt-3 border-t border-slate-100 space-y-2">
                                <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">
                                    Add Response or Inquiry Message
                                </label>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        required
                                        value={replyMsg}
                                        onChange={(e) => setReplyMsg(e.target.value)}
                                        placeholder="Type an official reply or employee follow-up..."
                                        className="flex-1 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:outline-none focus:bg-white focus:border-blue-600"
                                    />
                                    <button
                                        type="submit"
                                        disabled={isSending}
                                        className="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-xl text-xs transition shrink-0"
                                    >
                                        Send
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div className="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between shrink-0 gap-2">
                            <button
                                onClick={onDownload}
                                className="px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl border border-slate-200 transition flex items-center gap-1.5"
                            >
                                <i data-lucide="download" className="w-3.5 h-3.5 text-blue-700"></i>
                                Download Ticket Slip
                            </button>

                            <div className="flex items-center gap-2">
                                {user && user.role === 'HR' && ticket.status !== 'RESOLVED' && onAdjustAmount && (
                                    <button
                                        onClick={onAdjustAmount}
                                        className="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-bold rounded-xl text-xs transition inline-flex items-center gap-1"
                                        title="Adjust compensation amount"
                                    >
                                        <i data-lucide="sliders" className="w-3.5 h-3.5 text-amber-700"></i>
                                        Adjust Amount
                                    </button>
                                )}
                                {user && user.role === 'HR' && ticket.status !== 'RESOLVED' && onCompensate && (
                                    <button
                                        onClick={onCompensate}
                                        className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-xl transition shadow-xs flex items-center gap-1.5"
                                        title="Compensate money through website & resolve"
                                    >
                                        <i data-lucide="credit-card" className="w-3.5 h-3.5"></i>
                                        Compensate & Resolve
                                    </button>
                                )}
                                {user && user.role === 'HR' && (
                                    <button
                                        onClick={onTakeAction}
                                        className="px-4 py-2 bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold rounded-xl transition shadow-xs"
                                    >
                                        Take HR Action
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 9. ANALYTICS & CSAT VIEW (Light Theme)
        // ==========================================
        function AnalyticsView({ complaints, stats }) {
            const chartRef1 = useRef(null);
            const chartRef2 = useRef(null);

            useEffect(() => {
                let c1 = null;
                let c2 = null;

                if (chartRef1.current) {
                    const ex = Chart.getChart(chartRef1.current);
                    if (ex) ex.destroy();

                    c1 = new Chart(chartRef1.current, {
                        type: 'doughnut',
                        data: {
                            labels: ['Payroll & Deductions', 'Mediclaim Health', 'IT Assets Hardware', 'Workplace Transport', 'Benefits Relocation', 'Appraisal Ethics'],
                            datasets: [{
                                data: [
                                    complaints.filter(c => c.category === 'PAYROLL').length,
                                    complaints.filter(c => c.category === 'HEALTH_INSURANCE').length,
                                    complaints.filter(c => c.category === 'IT_ASSETS').length,
                                    complaints.filter(c => c.category === 'WORKPLACE_SAFETY').length,
                                    complaints.filter(c => c.category === 'BENEFITS').length,
                                    complaints.filter(c => c.category === 'APPRAISAL_ETHICS').length,
                                ],
                                backgroundColor: ['#1e3a8a', '#0284c7', '#0d9488', '#e11d48', '#d97706', '#7c3aed']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { position: 'right', labels: { color: '#334155', font: { size: 11 } } }
                            }
                        }
                    });
                }

                if (chartRef2.current) {
                    const ex2 = Chart.getChart(chartRef2.current);
                    if (ex2) ex2.destroy();

                    c2 = new Chart(chartRef2.current, {
                        type: 'bar',
                        data: {
                            labels: ['Critical (4h)', 'High (24h)', 'Medium (48h)', 'Low (72h)'],
                            datasets: [{
                                label: 'Grievance Count',
                                data: [
                                    complaints.filter(c => c.priority === 'CRITICAL').length,
                                    complaints.filter(c => c.priority === 'HIGH').length,
                                    complaints.filter(c => c.priority === 'MEDIUM').length,
                                    complaints.filter(c => c.priority === 'LOW').length,
                                ],
                                backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } },
                                x: { ticks: { color: '#64748b' }, grid: { color: '#e2e8f0' } }
                            },
                            plugins: {
                                legend: { display: false }
                            }
                        }
                    });
                }

                return () => {
                    if (c1) c1.destroy();
                    if (c2) c2.destroy();
                };
            }, [complaints]);

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                            <i data-lucide="bar-chart-3" className="w-5 h-5 text-blue-700"></i>
                            Nexus Resolution Analytics & SLA Metrics
                        </h2>
                        <p className="text-xs text-slate-500 mt-0.5">Corporate compliance, response times, and grievance volume analytics.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                            <h3 className="text-sm font-bold text-slate-900">Grievances by Functional Department</h3>
                            <div className="h-64">
                                <canvas ref={chartRef1}></canvas>
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
                            <h3 className="text-sm font-bold text-slate-900">Grievance Distribution by SLA Priority Tier</h3>
                            <div className="h-64">
                                <canvas ref={chartRef2}></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
