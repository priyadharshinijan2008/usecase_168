    <!-- Babel CDN for JSX rendering -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->

    <style>
        body { 
            background-color: #f8fafc; 
            color: #0f172a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            body * { visibility: hidden; }
            #printable-ticket-slip, #printable-ticket-slip * { visibility: visible; }
            #printable-ticket-slip { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = '/api';

        async function apiCall(endpoint, options = {}) {
            try {
                const res = await fetch(API_BASE + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                if (!res.ok) throw new Error(await res.text());
                return await res.json();
            } catch (err) {
                console.warn("API error:", err.message);
                throw err;
            }
        }

        // =========================================================================
        // EXACT ROSTER: 2 HRs & 8 Employees with explicit Employee IDs & Passwords
        // =========================================================================

                designation: 'DevOps Engineer',

                departmentName: 'Cloud Infrastructure',
                avatar: 'VB',

            },
            {

                employeeId: 'EMP-2004',
                password: 'meenakshipassword',

                role: 'EMPLOYEE',

                email: 'meenakshi.n@nexusres.com',

            },
            {

                phone: '+91-94441-11005'
            },
            {
                id: 106,
                employeeId: 'EMP-2006',
                password: 'divyapassword',
                fullName: 'Divya Krishnan',
                role: 'EMPLOYEE',
                designation: 'Data Analyst',
                email: 'divya.krishnan@nexusres.com',
                departmentName: 'Business Intelligence',
                avatar: 'DK',
                phone: '+91-94441-11006'
            },
            {
                id: 107,
                employeeId: 'EMP-2007',
                password: 'sureshpassword',
                fullName: 'Suresh Venkatesh',
                role: 'EMPLOYEE',
                designation: 'Technical Account Manager',
                email: 'suresh.venkatesh@nexusres.com',
                departmentName: 'Client Operations',
                avatar: 'SV',
                phone: '+91-94441-11007'
            },
            {
                id: 108,
                employeeId: 'EMP-2008',
                password: 'deepapassword',
                fullName: 'Deepa Subramanian',
                role: 'EMPLOYEE',
                designation: 'Finance Executive',
                email: 'deepa.subramanian@nexusres.com',
                departmentName: 'Corporate Finance',
                avatar: 'DS',
                phone: '+91-94441-11008'
            }
        ];

        function App() {
            // Logged in user state: authenticated via Employee ID and password (restores session if logged in)
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    const saved = localStorage.getItem('nexus_auth_user');
                    return saved ? JSON.parse(saved) : null;
                } catch {
                    return null;
                }
            }); 
            // Triple Bar sidebar open/collapsed state
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [activeTab, setActiveTab] = useState(() => {
                try {
                    const saved = localStorage.getItem('nexus_auth_user');
                    if (saved) {
                        const u = JSON.parse(saved);
                        return u.role === 'HR' ? 'hr-dashboard' : 'employee-dashboard';
                    }
                } catch {}
                return 'login';
            }); 
            const [complaints, setComplaints] = useState([]);
            const [stats, setStats] = useState(null);
            const [selectedTicket, setSelectedTicket] = useState(null);
            const [downloadModalTicket, setDownloadModalTicket] = useState(null);
            const [actionModalTicket, setActionModalTicket] = useState(null);
            const [compensationModalTicket, setCompensationModalTicket] = useState(null);
            const [adjustModalTicket, setAdjustModalTicket] = useState(null);
            const [toast, setToast] = useState(null);
            const [topSearchTicket, setTopSearchTicket] = useState('');

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const loadData = async () => {
                try {
                    const st = await apiCall('/dashboard/statistics');
                    setStats(st);
                    const list = await apiCall('/complaints');
                    if (list && list.length > 0) setComplaints(list);
                } catch (e) {
                    console.error("Could not fetch data", e);
                }
            };

            useEffect(() => {
                loadData();
                const interval = setInterval(loadData, 12000);
                return () => clearInterval(interval);
            }, []);

            // Refresh icons on state changes
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) window.lucide.createIcons();
                }, 50);
                return () => clearTimeout(timer);
            }, [activeTab, currentUser, complaints, selectedTicket, downloadModalTicket, actionModalTicket, compensationModalTicket, adjustModalTicket, sidebarOpen]);

            const handleLogin = (user) => {
                setCurrentUser(user);
                try {
                    localStorage.setItem('nexus_auth_user', JSON.stringify(user));
                } catch {}
                if (user.role === 'HR') {
                    setActiveTab('hr-dashboard');
                } else {
                    setActiveTab('employee-dashboard');
                }
                showToast(`Welcome back, ${user.fullName} (${user.employeeId})`);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                try {
                    localStorage.removeItem('nexus_auth_user');
                } catch {}
                setActiveTab('login');
                showToast('You have been signed out.');
            };

            const handleDownloadTicket = (ticket) => {
                setDownloadModalTicket(ticket);
            };

            const openActionModal = (ticket) => {
                setActionModalTicket(ticket);
            };

            const openCompensationModal = (ticket) => {
                setCompensationModalTicket(ticket);
            };

            const openAdjustModal = (ticket) => {
                setAdjustModalTicket(ticket);
            };

            const handleQuickSearchSubmit = (e) => {
                e.preventDefault();
                if (!topSearchTicket.trim()) return;
                const found = complaints.find(c => c.ticketNumber.toUpperCase() === topSearchTicket.trim().toUpperCase());
                if (found) {
                    setSelectedTicket(found);
                    setTopSearchTicket('');
                } else {
                    showToast(`No grievance found with ticket # ${topSearchTicket}`, 'error');
                }
            };

            // If user is not logged in, render the Light Theme Login Page
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col justify-between">
                        <LoginPage onLogin={handleLogin} complaints={complaints} stats={stats} onDownloadTicket={handleDownloadTicket} />
                        
                        {/* Download Modal if accessed from login page lookup */}
                        {downloadModalTicket && (
                            <TicketSlipDownloadModal
                                ticket={downloadModalTicket}
                                onClose={() => setDownloadModalTicket(null)}
                                showToast={showToast}
                            />
                        )}

                        {/* Toast Notification */}
                        {toast && (
                            <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-blue-600 animate-fade-in transition">
                                <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle-2'} className={`w-5 h-5 ${toast.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`}></i>
                                <span className="text-sm font-medium">{toast.msg}</span>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-100 text-slate-800">
                    {/* TOP HEADER WITH TRIPLE BAR (HAMBURGER) BUTTON */}
                    <header className="h-16 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center justify-between sticky top-0 z-30 shadow-xs">
                        <div className="flex items-center gap-3 md:gap-4">
                            {/* TRIPLE BAR BUTTON (TOGGLE SIDEBAR) */}
                            <button
                                id="triple-bar-toggle"
                                onClick={() => setSidebarOpen(!sidebarOpen)}
                                className="p-2 rounded-xl text-slate-600 hover:text-blue-700 hover:bg-slate-100 transition border border-slate-200 shadow-xs focus:outline-none focus:ring-2 focus:ring-blue-600/20"
                                title="Toggle Sidebar (Triple Bar)"
                            >
                                <i data-lucide="menu" className="w-5 h-5"></i>
                            </button>

                            {/* Brand Header */}
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-xl bg-blue-700 text-white flex items-center justify-center font-black text-base shadow-sm">
                                    NR
                                </div>
                                <div className="hidden sm:block">
                                    <div className="flex items-center gap-2">
                                        <h1 className="font-extrabold text-slate-900 text-sm tracking-tight">NEXUS RESOLUTION</h1>
                                        <span className="text-[10px] bg-blue-50 text-blue-700 font-bold px-1.5 py-0.2 rounded border border-blue-200 uppercase">
                                            Enterprise
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-slate-500 font-medium leading-none">Internal Grievance & SLA Governance</p>
                                </div>
                            </div>
                        </div>

                        {/* Middle Quick Search */}
                        <form onSubmit={handleQuickSearchSubmit} className="hidden md:flex items-center relative max-w-xs w-full mx-4">
                            <i data-lucide="search" className="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
                            <input
                                type="text"
                                value={topSearchTicket}
                                onChange={(e) => setTopSearchTicket(e.target.value)}
                                placeholder="Lookup ticket # (e.g. NEX-2026-000001)"
                                className="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition font-mono"
                            />
                        </form>

                        {/* Right Area: Logged In User Pill & STRICT LOG OUT BUTTON */}
                        <div className="flex items-center gap-3">
                            {/* Role badge */}
                            <span className={`hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full font-semibold border ${currentUser.role === 'HR' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                <i data-lucide={currentUser.role === 'HR' ? 'shield-check' : 'user'} className="w-3.5 h-3.5"></i>
                                {currentUser.role === 'HR' ? 'HR Officer' : 'Employee'}
                            </span>

                            {/* Active User Chip */}
                            <div className="flex items-center gap-2 px-2.5 py-1 bg-slate-50 border border-slate-200 rounded-xl shadow-xs">
                                <div className="w-7 h-7 rounded-lg bg-blue-700 text-white flex items-center justify-center font-bold text-xs shadow-xs">
                                    {currentUser.avatar}
                                </div>
                                <div className="text-left hidden md:block">
                                    <p className="text-xs font-bold text-slate-900 leading-tight">{currentUser.fullName}</p>
                                    <p className="text-[10px] text-slate-500 font-mono">{currentUser.employeeId}</p>
                                </div>
                            </div>

                            {/* LOG OUT BUTTON */}
                            <button
                                id="btn-logout"
                                onClick={handleLogout}
                                className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 hover:text-rose-800 rounded-xl border border-rose-200 transition shadow-xs"
                                title="Sign out of Nexus Resolution"
                            >
                                <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                                <span className="hidden sm:inline">Log Out</span>
                            </button>
                        </div>
                    </header>

                    {/* TRIPLE BAR DASHBOARD LAYOUT (COLLAPSIBLE SIDEBAR + MAIN WORKSPACE) */}
                    <div className="flex-1 flex overflow-hidden">
                        {/* SIDEBAR NAVIGATION */}
                        <aside
                            id="dashboard-sidebar"
                            className={`${sidebarOpen ? 'w-64' : 'w-0 -translate-x-full md:w-16 md:translate-x-0'} transition-all duration-200 bg-white border-r border-slate-200 flex flex-col justify-between z-20 shrink-0 select-none overflow-hidden`}
                        >
                            {/* Sidebar Links */}
                            <div className="p-3 space-y-4 overflow-y-auto custom-scrollbar flex-1">
                                {sidebarOpen && (
                                    <div className="px-3 pt-2">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                                            {currentUser.role === 'HR' ? 'HR Action Center' : 'Employee Workspace'}
                                        </p>
                                    </div>
                                )}

                                <nav className="space-y-1">
                                    {currentUser.role === 'HR' ? (
                                        <>
                                            <SidebarNavBtn
                                                id="hr-dashboard"
                                                label="HR Dashboard"
                                                icon="shield-alert"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                sidebarOpen={sidebarOpen}
                                            />
                                            <SidebarNavBtn
                                                id="complaints"
                                                label="All 50 Grievances"
                                                icon="inbox"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                badge={complaints.length}
                                                sidebarOpen={sidebarOpen}
                                            />
                                            <SidebarNavBtn
                                                id="analytics"
                                                label="Analytics & CSAT"
                                                icon="bar-chart-3"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                sidebarOpen={sidebarOpen}
                                            />
                                        </>
                                    ) : (
                                        <>
                                            <SidebarNavBtn
                                                id="employee-dashboard"
                                                label="My Grievances"
                                                icon="user"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                badge={complaints.filter(c => c.employeeId === currentUser.employeeId).length}
                                                sidebarOpen={sidebarOpen}
                                            />
                                            <SidebarNavBtn
                                                id="register"
                                                label="Register Grievance"
                                                icon="plus-circle"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                highlight
                                                sidebarOpen={sidebarOpen}
                                            />
                                            <SidebarNavBtn
                                                id="complaints"
                                                label="All Grievances"
                                                icon="list"
                                                activeTab={activeTab}
                                                setActiveTab={setActiveTab}
                                                badge={complaints.length}
                                                sidebarOpen={sidebarOpen}
                                            />
                                        </>
                                    )}
                                </nav>

                                {sidebarOpen && (
                                    <div className="px-3 pt-4 border-t border-slate-100">
                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">
                                            Quick Resolution Info
                                        </p>
                                        <div className="bg-blue-50/70 p-3 rounded-xl border border-blue-100 space-y-2 text-[11px]">
                                            <div className="flex items-center justify-between text-slate-700">
                                                <span>Active Tickets</span>
                                                <strong className="text-blue-700">{complaints.length}</strong>
                                            </div>
                                            <div className="flex items-center justify-between text-slate-700">
                                                <span>SLA Commitment</span>
                                                <strong className="text-emerald-700">4h - 72h Max</strong>
                                            </div>
                                            <div className="flex items-center justify-between text-slate-700">
                                                <span>Official Slip</span>
                                                <strong className="text-slate-900">Auto Generated</strong>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Sidebar Footer User Card + Log Out */}
                            <div className="p-3 border-t border-slate-200 bg-slate-50/80">
                                {sidebarOpen ? (
                                    <div className="space-y-2">
                                        <div className="flex items-center gap-2.5">
                                            <div className="w-8 h-8 rounded-lg bg-blue-700 text-white flex items-center justify-center font-bold text-xs shadow-xs">
                                                {currentUser.avatar}
                                            </div>
                                            <div className="overflow-hidden">
                                                <p className="text-xs font-bold text-slate-900 truncate">{currentUser.fullName}</p>
                                                <p className="text-[10px] text-slate-500 truncate">{currentUser.designation}</p>
                                            </div>
                                        </div>
                                        <button
                                            onClick={handleLogout}
                                            className="w-full flex items-center justify-center gap-1.5 py-1.5 px-3 bg-white hover:bg-rose-50 text-rose-700 hover:text-rose-800 border border-slate-200 hover:border-rose-200 rounded-xl text-xs font-semibold transition shadow-xs"
                                        >
                                            <i data-lucide="log-out" className="w-3.5 h-3.5"></i>
                                            Log Out
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={handleLogout}
                                        className="w-full p-2 flex items-center justify-center text-rose-700 hover:bg-rose-50 rounded-xl transition"
                                        title="Log Out"
                                    >
                                        <i data-lucide="log-out" className="w-4 h-4"></i>
                                    </button>
                                )}
                            </div>
                        </aside>

                        {/* MAIN DASHBOARD CONTENT AREA */}
                        <main className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6">
                            {activeTab === 'hr-dashboard' && (
                                <HRDashboard
                                    user={currentUser}
                                    complaints={complaints}
                                    stats={stats}
                                    onSelectTicket={setSelectedTicket}
                                    onTakeAction={openActionModal}
                                    onCompensate={openCompensationModal}
                                    onAdjustAmount={openAdjustModal}
                                    onDownloadTicket={handleDownloadTicket}
                                    loadData={loadData}
                                    showToast={showToast}
                                />
                            )}

                            {activeTab === 'employee-dashboard' && (
                                <EmployeeDashboard
                                    user={currentUser}
                                    complaints={complaints}
                                    onSelectTicket={setSelectedTicket}
                                    onDownloadTicket={handleDownloadTicket}
                                    onGoRegister={() => setActiveTab('register')}
                                    loadData={loadData}
                                    showToast={showToast}
                                />
                            )}

                            {activeTab === 'complaints' && (
                                <ComplaintsDirectory
                                    complaints={complaints}
                                    user={currentUser}
                                    onSelectTicket={setSelectedTicket}
                                    onDownloadTicket={handleDownloadTicket}
                                    onTakeAction={openActionModal}
                                    onCompensate={openCompensationModal}
                                    onAdjustAmount={openAdjustModal}
                                />
                            )}

                            {activeTab === 'register' && (
                                <RegisterGrievanceView
                                    user={currentUser}
                                    onSuccess={(newTicket) => {
                                        loadData();
                                        showToast(`Grievance ${newTicket.ticketNumber} filed successfully!`);
                                        // Default process: automatically pop up official ticket slip for download/print
                                        setDownloadModalTicket(newTicket);
                                        setActiveTab(currentUser.role === 'HR' ? 'hr-dashboard' : 'employee-dashboard');
                                    }}
                                    onCancel={() => setActiveTab(currentUser.role === 'HR' ? 'hr-dashboard' : 'employee-dashboard')}
                                />
                            )}

                            {activeTab === 'analytics' && (
                                <AnalyticsView complaints={complaints} stats={stats} />
                            )}
                        </main>
                    </div>

                    {/* Ticket Details Drawer / Modal */}
                    {selectedTicket && (
                        <TicketDetailModal
                            ticket={selectedTicket}
                            user={currentUser}
                            onClose={() => setSelectedTicket(null)}
                            onDownload={() => handleDownloadTicket(selectedTicket)}
                            onTakeAction={() => {
                                const t = selectedTicket;
                                setSelectedTicket(null);
                                openActionModal(t);
                            }}
                            onCompensate={() => {
                                const t = selectedTicket;
                                setSelectedTicket(null);
                                openCompensationModal(t);
                            }}
                            onAdjustAmount={() => {
                                const t = selectedTicket;
                                setSelectedTicket(null);
                                openAdjustModal(t);
                            }}
                            showToast={showToast}
                            loadData={loadData}
                        />
                    )}

                    {/* HR Action Modal */}
                    {actionModalTicket && (
                        <HRActionModal
                            ticket={actionModalTicket}
                            hrUser={currentUser.role === 'HR' ? currentUser : SYSTEM_USERS[0]}
                            onClose={() => setActionModalTicket(null)}
                            onCompensate={() => {
                                const t = actionModalTicket;

        // ==========================================
        // LOGIN PAGE VIEW (Clean Enterprise Login - No Exposed Credential List)
        // ==========================================
        function LoginPage({ onLogin, complaints, stats, onDownloadTicket }) {
            const [employeeIdInput, setEmployeeIdInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [ticketLookupInput, setTicketLookupInput] = useState('');

            const handleFormSubmit = async (e) => {
                e.preventDefault();
                setLoginError('');

                const cleanId = employeeIdInput.trim().toUpperCase();
                const cleanPass = passwordInput.trim();

                if (!cleanId) {
                    setLoginError('Please enter your Employee ID.');
                    return;
                }
                if (!cleanPass) {
                    setLoginError('Please enter your confidential password.');
                    return;
                }

                setIsSubmitting(true);

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ employeeId: cleanId, password: cleanPass })
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        setLoginError(data.error || 'Authentication failed. Please check your credentials.');
                        setIsSubmitting(false);
                        return;
                    }

                    // Successful login for this respective employee / HR officer
                    onLogin(data);
                } catch (err) {
                    // Fallback verification if offline
                    const matchedUser = SYSTEM_USERS.find(u => u.employeeId.toUpperCase() === cleanId);
                    if (matchedUser && matchedUser.password === cleanPass) {
                        onLogin(matchedUser);
                    } else if (!matchedUser) {
                        setLoginError('Invalid Employee ID. Please check your ID or contact administration.');
                    } else {
                        setLoginError('Incorrect password. Please enter the correct password for your account.');
                    }
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleTicketLookup = (e) => {
                e.preventDefault();
                if (!ticketLookupInput.trim()) return;
                const found = complaints.find(c => c.ticketNumber.toUpperCase() === ticketLookupInput.trim().toUpperCase());
                if (found) {
                    onDownloadTicket(found);
                } else {
                    alert(`Ticket number "${ticketLookupInput}" not found in database.`);
                }
            };

            return (
                <div className="max-w-5xl mx-auto px-4 py-10 md:py-16 space-y-8">
                    {/* Header Branding */}
                    <div className="text-center space-y-3">
                        <div className="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-700 text-white font-black text-2xl shadow-md">
                            NR

                            Nexus Resolution Portal

                        <p className="text-slate-600 text-sm md:text-base max-w-xl mx-auto">
                            Enterprise Grievance Resolution & SLA Governance Platform

                                    <i data-lucide="lock" className="w-5 h-5 text-blue-700"></i>
                                    Employee & HR Secure Sign In
                                </h3>
                                <p className="text-xs text-slate-500 mt-1">
                                    Enter your Employee ID and correct password to access your respective dashboard.
                                </p>
                            </div>

                            {loginError && (
                                <div className="p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-xs font-semibold text-rose-700 flex items-start gap-2.5 animate-fade-in">
                                    <i data-lucide="alert-circle" className="w-4 h-4 shrink-0 mt-0.5 text-rose-600"></i>
                                    <span>{loginError}</span>
                                </div>
                            )}

                            <form onSubmit={handleFormSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                                        Employee ID
                                    </label>
                                    <div className="relative">
                                        <i data-lucide="badge" className="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5 pointer-events-none"></i>

                                                if (loginError) setLoginError('');
                                            }}

                                            className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono text-slate-900 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition"
                                            autoComplete="username"
                                        />
                                    </div>

                                    </p>

                                <div className="pt-2">
                                    <button

                                    >
                                        {isSubmitting ? (
                                            <>
                                                <i data-lucide="loader-2" className="w-4 h-4 animate-spin"></i>
                                                Authenticating...
                                            </>
                                        ) : (
                                            <>
                                                <i data-lucide="log-in" className="w-4 h-4"></i>
                                                Sign In to My Dashboard
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>

                            <div className="pt-4 border-t border-slate-100 flex items-center gap-2 text-xs text-slate-500">
                                <i data-lucide="shield-check" className="w-4 h-4 text-blue-700 shrink-0"></i>
                                <span>Access is authenticated. Employees and HR staff are securely routed to their respective workspaces upon verification.</span>
                            </div>
                        </div>

                        {/* Fast Track Ticket Slip Lookup & System Metrics (5 cols) */}
                        <div className="md:col-span-5 space-y-6">

                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">

                    </div>

        function RegisterGrievanceView({ user, onSuccess, onCancel }) {
            const [subject, setSubject] = useState('');
            const [description, setDescription] = useState('');
            const [departmentId, setDepartmentId] = useState(1);

            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                try {
                    const formattedClaim = monetaryValue ? `₹${Number(monetaryValue).toLocaleString('en-IN')}` : null;
                    const payload = {
                        employeeId: user.employeeId,
                        customerName: user.fullName,
                        customerEmail: user.email,
                        customerPhone: user.phone || '+91-94441-11000',
                        subject,
                        description: formattedClaim ? `${description} [Claim Amount: ${formattedClaim}]` : description,
                        claimedAmount: formattedClaim,
                        originalClaimedAmount: formattedClaim,
                        category,
                        priority,
                        departmentId: parseInt(departmentId, 10)
                    };

                    const newTicket = await apiCall('/complaints', {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });

                    setIsSubmitting(false);
                    onSuccess(newTicket);
                } catch (err) {
                    setIsSubmitting(false);
                    alert("Error submitting grievance: " + err.message);
                }

        // ==========================================
        // 7b. CORPORATE WEBSITE COMPENSATION MODAL
        // ==========================================
        function CompensationModal({ ticket, hrUser, onClose, onSuccess, onViewSlip, showToast }) {
            // Extract claimed monetary value if existing in ticket
            const rawClaimed = ticket.originalClaimedAmount || ticket.claimedAmount || (() => {
                const match = (ticket.description || '').match(/(?:₹|Rs\.?|INR)\s*([\d,]+)/i);
                return match ? `₹${match[1]}` : null;
            })() || (ticket.resolvedAmount && ticket.resolvedAmount.startsWith('₹') ? ticket.resolvedAmount : null);

            const claimedNum = parseFloat(String(rawClaimed || '').replace(/[^0-9.]/g, '')) || 0;

            const initialAmount = (() => {
                if (ticket.hrApprovedAmount) {
                    const clean = ticket.hrApprovedAmount.replace(/[^0-9.]/g, '');
                    if (clean && !isNaN(clean)) return clean;
                }
                if (ticket.resolvedAmount) {
                    const clean = ticket.resolvedAmount.replace(/[^0-9.]/g, '');
                    if (clean && !isNaN(clean)) return clean;
                }
                if (claimedNum > 0) return String(claimedNum);
                return '14800';
            })();

            const [amount, setAmount] = useState(initialAmount);
            const [adjustmentReasonPreset, setAdjustmentReasonPreset] = useState(
                ticket.amountAdjustmentReason || 'Employee inflated/increased amount unwantedly (Deducted unauthorized charges)'
            );
            const [customAdjustmentReason, setCustomAdjustmentReason] = useState(
                ticket.amountAdjustmentReason || ''
            );
            const [paymentMethod, setPaymentMethod] = useState('Corporate Instant IMPS / NEFT Gateway');
            const [beneficiaryAccount, setBeneficiaryAccount] = useState(
                () => `HDFC Bank Salary A/c •••• ${ticket.employeeId.replace(/[^0-9]/g, '').slice(-4) || '4892'} (IFSC: HDFC0001242)`
            );
            const [transactionId, setTransactionId] = useState(
                () => `TXN-NEX-${Date.now().toString().slice(-6)}-${Math.floor(1000 + Math.random() * 9000)}`
            );
            const [settlementNotes, setSettlementNotes] = useState(
                () => `Assignment settlement for grievance ${ticket.ticketNumber}. Compensation sanctioned by HR in accordance with corporate resolution standards.`
            );
            const [isProcessing, setIsProcessing] = useState(false);
            const [paymentSuccess, setPaymentSuccess] = useState(null);

            const currentNum = parseFloat(String(amount).replace(/[^0-9.]/g, '')) || 0;
            const isAdjusted = claimedNum > 0 && Math.abs(currentNum - claimedNum) > 0.01;
            const isReduced = isAdjusted && currentNum < claimedNum;
            const diffAmount = Math.abs(currentNum - claimedNum);

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [paymentSuccess, isAdjusted]);

            const generateNewTxn = () => {
                setTransactionId(`TXN-NEX-${Date.now().toString().slice(-6)}-${Math.floor(1000 + Math.random() * 9000)}`);
            };

            const handleDisburse = async (e) => {
                e.preventDefault();
                const numericAmount = parseFloat(String(amount).replace(/[^0-9.]/g, ''));
                if (!numericAmount || numericAmount <= 0) {
                    alert('Please specify a valid compensation amount greater than ₹0.');
                    return;
                }

                const finalAdjustmentReason = isAdjusted
                    ? (customAdjustmentReason.trim() || adjustmentReasonPreset)
                    : (ticket.amountAdjustmentReason || null);

                setIsProcessing(true);

                try {
                    const res = await apiCall(`/complaints/${ticket.id}/compensate`, {
                        method: 'POST',
                        body: JSON.stringify({
                            amount: numericAmount,
                            paymentMethod,
                            beneficiaryAccount,
                            transactionId,
                            settlementNotes,
                            hrName: hrUser.fullName,
                            hrEmployeeId: hrUser.employeeId,
                            isAmountAdjusted: isAdjusted || ticket.isAmountAdjusted,
                            originalClaimedAmount: claimedNum > 0 ? `₹${claimedNum.toLocaleString('en-IN')}` : ticket.claimedAmount,
                            adjustmentReason: finalAdjustmentReason
                        })

        // ==========================================
        // 7c. HR COMPENSATION ADJUSTMENT MODAL
