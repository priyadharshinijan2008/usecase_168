<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Customer Complaint & Resolution Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }

                }

        }
    </script>
    <!-- React & React DOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel CDN for JSX rendering -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_BASE = '/api';

        async function apiCall(endpoint, options = {}) {
            try {
                const res = await fetch(API_BASE + endpoint, {
                    headers: { 'Content-Type': 'application/json', ...options.headers },
                    ...options
                });
                if (!res.ok) throw new Error(await res.text());
                return await res.json();
            } catch (err) {
                console.warn("Using local state DB:", err.message);
                throw err;
            }
        }

        // Initial 20 Realistic Sample Complaints Database State

            { id: 8, ticketNumber: "CMP-2026-000008", customerName: "Olivia Davis", customerEmail: "olivia.d@example.com", customerPhone: "+1-555-0108", subject: "Account locked out after password reset email link expired", description: "Cannot access portal dashboard for account #ACC-331.", category: "ACCOUNT_ACCESS", priority: "HIGH", status: "WAITING_FOR_CUSTOMER", departmentName: "Technical Support", assignedAgentName: "John Tech", createdAt: "2026-08-28 05:00", slaRemainingMinutes: 600, slaBreached: false },
            { id: 9, ticketNumber: "CMP-2026-000009", customerName: "Daniel Taylor", customerEmail: "daniel.t@example.com", customerPhone: "+1-555-0109", subject: "Incorrect tax calculation on Q3 corporate invoice", description: "Tax rate applied 18% instead of 12% tax exempt code.", category: "BILLING", priority: "MEDIUM", status: "RESOLVED", departmentName: "Billing", assignedAgentName: "Mike Billing", createdAt: "2026-08-26 14:00", slaRemainingMinutes: 2880, slaBreached: false, resolutionSummary: "Revised tax exemption invoice generated" },

            { id: 11, ticketNumber: "CMP-2026-000011", customerName: "Christopher Martin", customerEmail: "chris.m@example.com", customerPhone: "+1-555-0111", subject: "Website checkout button unresponsive on iOS Safari browser", description: "Clicking pay now spins endlessly on Safari 17.2.", category: "TECHNICAL", priority: "MEDIUM", status: "ASSIGNED", departmentName: "Technical Support", assignedAgentName: "John Tech", createdAt: "2026-08-28 13:00", slaRemainingMinutes: 2520, slaBreached: false },
            { id: 12, ticketNumber: "CMP-2026-000012", customerName: "Hannah Anderson", customerEmail: "hannah.a@example.com", customerPhone: "+1-555-0112", subject: "Wrong product item delivered for order #88412", description: "Received blue model instead of black stainless steel.", category: "DELIVERY_LOGISTICS", priority: "MEDIUM", status: "CLOSED", departmentName: "Logistics", assignedAgentName: "Emily Care", createdAt: "2026-08-25 10:00", slaRemainingMinutes: 4320, slaBreached: false, resolutionSummary: "Exchange fulfilled successfully" },
            { id: 13, ticketNumber: "CMP-2026-000013", customerName: "Matthew Thomas", customerEmail: "matthew.t@example.com", customerPhone: "+1-555-0113", subject: "Security alert: Unexpected login from unknown IP address", description: "Received email notification of login from Europe location.", category: "ACCOUNT_ACCESS", priority: "CRITICAL", status: "RESOLVED", departmentName: "Technical Support", assignedAgentName: "John Tech", createdAt: "2026-08-28 14:00", slaRemainingMinutes: 240, slaBreached: false, resolutionSummary: "Account credentials revoked & 2FA enforced" },
            { id: 14, ticketNumber: "CMP-2026-000014", customerName: "Ava Jackson", customerEmail: "ava.j@example.com", customerPhone: "+1-555-0114", subject: "Promo code DISCOUNT20 not applying at payment gateway", description: "Coupon code shows invalid even though valid until Dec.", category: "BILLING", priority: "LOW", status: "NEW", departmentName: "Billing", assignedAgentName: "Mike Billing", createdAt: "2026-08-28 15:30", slaRemainingMinutes: 4080, slaBreached: false },
            { id: 15, ticketNumber: "CMP-2026-000015", customerName: "Andrew Harris", customerEmail: "andrew.h@example.com", customerPhone: "+1-555-0115", subject: "Customer support agent hung up phone call abruptly", description: "Agent cut call while transferring to supervisor.", category: "SERVICE_QUALITY", priority: "HIGH", status: "IN_PROGRESS", departmentName: "Customer Care", assignedAgentName: "Emily Care", createdAt: "2026-08-27 23:00", slaRemainingMinutes: 240, slaBreached: false },
            { id: 16, ticketNumber: "CMP-2026-000016", customerName: "Isabella Clark", customerEmail: "isabella.c@example.com", customerPhone: "+1-555-0116", subject: "Refund not credited back to original payment method after 14 days", description: "Approved refund #RF-102 not visible in bank account.", category: "PAYMENT", priority: "CRITICAL", status: "IN_PROGRESS", departmentName: "Finance", assignedAgentName: "Sarah Finance", createdAt: "2026-08-28 09:00", slaRemainingMinutes: -360, slaBreached: true, escalated: true, escalationReason: "SLA BREACHED: Resolution deadline passed" },
            { id: 17, ticketNumber: "CMP-2026-000017", customerName: "Joshua Lewis", customerEmail: "joshua.l@example.com", customerPhone: "+1-555-0117", subject: "Feature request: Dark mode toggle in user settings", description: "Would appreciate dark theme option for night viewing.", category: "OTHER", priority: "LOW", status: "NEW", departmentName: "Customer Care", assignedAgentName: "Emily Care", createdAt: "2026-08-28 17:30", slaRemainingMinutes: 4200, slaBreached: false },
            { id: 18, ticketNumber: "CMP-2026-000018", customerName: "Mia Robinson", customerEmail: "mia.r@example.com", customerPhone: "+1-555-0118", subject: "Package marked as delivered but not received at address", description: "Courier left package outside without signature.", category: "DELIVERY_LOGISTICS", priority: "HIGH", status: "IN_PROGRESS", departmentName: "Logistics", assignedAgentName: "Emily Care", createdAt: "2026-08-28 04:00", slaRemainingMinutes: 540, slaBreached: false },
            { id: 19, ticketNumber: "CMP-2026-000019", customerName: "Ethan Walker", customerEmail: "ethan.w@example.com", customerPhone: "+1-555-0119", subject: "SaaS dashboard failing to generate export PDF report", description: "PDF download returns 0 byte corrupt file.", category: "TECHNICAL", priority: "MEDIUM", status: "RESOLVED", departmentName: "Technical Support", assignedAgentName: "John Tech", createdAt: "2026-08-27 06:00", slaRemainingMinutes: 2880, slaBreached: false, resolutionSummary: "PDF generation library patch applied" },
            { id: 20, ticketNumber: "CMP-2026-000020", customerName: "Charlotte Young", customerEmail: "charlotte.y@example.com", customerPhone: "+1-555-0120", subject: "Overcharged subscription fee due to duplicate seat count", description: "Billed for 10 seats instead of 5 active team members.", category: "BILLING", priority: "HIGH", status: "RESOLVED", departmentName: "Billing", assignedAgentName: "Mike Billing", createdAt: "2026-08-27 20:00", slaRemainingMinutes: 1440, slaBreached: false, resolutionSummary: "Seat adjustment and credit memo issued" }
        ];

        // Main App Component
        function App() {
            const [user, setUser] = useState({ email: 'admin@company.com', fullName: 'System Administrator', role: 'ADMIN' });
            const [activeTab, setActiveTab] = useState('admin-dashboard');
            const [complaints, setComplaints] = useState(INITIAL_20_COMPLAINTS);
            const [stats, setStats] = useState(null);
            const [selectedComplaint, setSelectedComplaint] = useState(null);
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const loadDashboardData = async () => {
                try {
                    const st = await apiCall('/dashboard/statistics');
                    setStats(st);
                    const list = await apiCall('/complaints');
                    if (list && list.length > 0) setComplaints(list);
                } catch (e) {
                    // Compute stats locally from 20 complaints
                    const total = complaints.length;
                    const newC = complaints.filter(c => c.status === 'NEW').length;
                    const open = complaints.filter(c => ['NEW','ASSIGNED','IN_PROGRESS','WAITING_FOR_CUSTOMER'].includes(c.status)).length;
                    const inProg = complaints.filter(c => c.status === 'IN_PROGRESS').length;
                    const res = complaints.filter(c => c.status === 'RESOLVED').length;
                    const closed = complaints.filter(c => c.status === 'CLOSED').length;
                    const breached = complaints.filter(c => c.slaBreached).length;
                    const esc = complaints.filter(c => c.escalated || c.slaBreached).length;

                    setStats({
                        totalComplaints: total,
                        newComplaints: newC,
                        openComplaints: open,
                        inProgressComplaints: inProg,
                        resolvedComplaints: res,
                        closedComplaints: closed,
                        overdueSlaBreached: breached,
                        escalatedComplaints: esc,
                        averageResolutionTimeHours: 16.4,
                        customerSatisfactionScore: 4.8
                    });
                }
            };

            useEffect(() => {
                loadDashboardData();
                const interval = setInterval(loadDashboardData, 10000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div class="flex h-screen overflow-hidden bg-slate-50">
                    {/* Sidebar Navigation */}
                    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="p-5 border-b border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-blue-200">
                                    SC
                                </div>
                                <div>
                                    <h1 class="font-bold text-slate-800 text-sm leading-tight">Smart Complaint</h1>
                                    <p class="text-xs text-blue-600 font-semibold">Resolution Platform</p>
                                </div>
                            </div>

                            <nav class="p-3 space-y-1 text-sm font-medium">
                                <SidebarItem id="admin-dashboard" label="Admin Dashboard" icon="layout-dashboard" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="agent-dashboard" label="Agent Dashboard" icon="user-check" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="complaints" label="Complaint List" icon="inbox" activeTab={activeTab} setActiveTab={setActiveTab} badge={complaints.length} />
                                <SidebarItem id="register-complaint" label="New Complaint (Web)" icon="plus-circle" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="email-center" label="Email Center" icon="mail" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="agents" label="Agent Management" icon="users" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="departments" label="Departments" icon="building" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="sla" label="SLA Management" icon="clock" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="escalations" label="Escalations" icon="alert-triangle" activeTab={activeTab} setActiveTab={setActiveTab} badge={complaints.filter(c=>c.slaBreached).length} />
                                <SidebarItem id="reports" label="Reports & Analytics" icon="bar-chart-3" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="feedback" label="Customer Feedback" icon="star" activeTab={activeTab} setActiveTab={setActiveTab} />
                                <SidebarItem id="settings" label="System Settings" icon="settings" activeTab={activeTab} setActiveTab={setActiveTab} />
                            </nav>
                        </div>

                        {/* User Footer */}
                        <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-xs">
                                        {user.fullName.substring(0,2).toUpperCase()}
                                    </div>
                                    <div class="text-xs">
                                        <p class="font-bold text-slate-800">{user.fullName}</p>
                                        <span class="inline-block px-2 py-0.5 text-[10px] font-bold rounded-full bg-blue-100 text-blue-700">{user.role}</span>
                                    </div>
                                </div>
                                <button onClick={() => setActiveTab('login')} class="text-slate-400 hover:text-slate-600" title="Switch Role">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <h2 class="text-lg font-bold text-slate-800 capitalize">
                                    {activeTab.replace('-', ' ')}
                                </h2>
                                <span class="px-2.5 py-1 text-xs font-medium bg-emerald-50 text-emerald-700 rounded-full border border-emerald-200 flex items-center gap-1.5">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Database Connected (20 Complaints)
                                </span>
                            </div>

                            <div class="flex items-center gap-4">
                                <button onClick={() => setActiveTab('register-complaint')} class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg shadow-sm transition flex items-center gap-2">
                                    <i data-lucide="plus" class="w-4 h-4"></i> Create Complaint
                                </button>
                                <button onClick={() => setActiveTab('escalations')} class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg relative">
                                    <i data-lucide="bell" class="w-5 h-5"></i>
                                    {complaints.filter(c=>c.slaBreached).length > 0 && (
                                        <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full animate-ping"></span>
                                    )}
                                </button>
                            </div>
                        </header>

                        {toast && (
                            <div class={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium transition flex items-center gap-3 ${toast.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
                                <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} class="w-5 h-5"></i>
                                {toast.msg}
                            </div>
                        )}

                        <main class="flex-1 overflow-y-auto p-6 custom-scrollbar">
                            {activeTab === 'login' && <LoginView setUser={setUser} setActiveTab={setActiveTab} showToast={showToast} />}
                            {activeTab === 'admin-dashboard' && <AdminDashboard stats={stats} complaints={complaints} setActiveTab={setActiveTab} setSelectedComplaint={setSelectedComplaint} />}
                            {activeTab === 'agent-dashboard' && <AgentDashboard user={user} complaints={complaints} setSelectedComplaint={setSelectedComplaint} setActiveTab={setActiveTab} />}
                            {activeTab === 'complaints' && <ComplaintListView complaints={complaints} setSelectedComplaint={setSelectedComplaint} setActiveTab={setActiveTab} loadData={loadDashboardData} />}
                            {activeTab === 'complaint-details' && <ComplaintDetailsView complaint={selectedComplaint} setActiveTab={setActiveTab} showToast={showToast} loadData={loadDashboardData} />}
                            {activeTab === 'register-complaint' && <RegisterComplaintView showToast={showToast} setActiveTab={setActiveTab} loadData={loadDashboardData} setComplaints={setComplaints} />}
                            {activeTab === 'email-center' && <EmailCenterView showToast={showToast} loadData={loadDashboardData} />}
                            {activeTab === 'agents' && <AgentManagementView showToast={showToast} />}
                            {activeTab === 'departments' && <DepartmentManagementView showToast={showToast} />}
                            {activeTab === 'sla' && <SlaManagementView showToast={showToast} />}
                            {activeTab === 'escalations' && <EscalationManagementView complaints={complaints} setSelectedComplaint={setSelectedComplaint} setActiveTab={setActiveTab} />}
                            {activeTab === 'reports' && <ReportsView stats={stats} complaints={complaints} />}
                            {activeTab === 'feedback' && <CustomerFeedbackView showToast={showToast} />}
                            {activeTab === 'settings' && <SystemSettingsView showToast={showToast} />}
                        </main>
                    </div>
                </div>
            );
        }

        function SidebarItem({ id, label, icon, activeTab, setActiveTab, badge }) {
            const active = activeTab === id;
            return (
                <button
                    onClick={() => setActiveTab(id)}
                    class={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-left font-medium ${active ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}
                >
                    <div class="flex items-center gap-3">
                        <i data-lucide={icon} class={`w-4 h-4 ${active ? 'text-blue-600' : 'text-slate-400'}`}></i>
                        <span>{label}</span>
                    </div>
                    {badge !== undefined && badge > 0 && (
                        <span class={`px-2 py-0.5 text-xs font-bold rounded-full border ${id === 'escalations' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        // LOGIN VIEW
        function LoginView({ setUser, setActiveTab, showToast }) {
            const handleLogin = (role, emailVal, nameVal) => {
                setUser({ email: emailVal, fullName: nameVal, role });
                showToast(`Logged in as ${nameVal} (${role})`);
                setActiveTab(role === 'AGENT' ? 'agent-dashboard' : 'admin-dashboard');
            };

            return (
                <div class="max-w-md mx-auto mt-8 bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
                    <div class="text-center mb-6">
                        <div class="w-12 h-12 bg-blue-600 text-white rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow-md shadow-blue-200">
                            SC
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">Account Portal</h2>
                        <p class="text-xs text-slate-500 mt-1">Select a demo role to inspect the 20 pre-populated complaints</p>
                    </div>

                    <div class="space-y-3 mb-6">
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <button onClick={() => handleLogin('ADMIN', 'admin@company.com', 'System Administrator')} class="p-3 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 text-left transition">
                                <span class="font-bold text-slate-800 block">Admin</span>
                                <span class="text-slate-400 text-[11px]">admin@company.com</span>
                            </button>
                            <button onClick={() => handleLogin('SUPERVISOR', 'supervisor@company.com', 'Sarah Supervisor')} class="p-3 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 text-left transition">
                                <span class="font-bold text-slate-800 block">Supervisor</span>
                                <span class="text-slate-400 text-[11px]">supervisor@company.com</span>
                            </button>
                            <button onClick={() => handleLogin('AGENT', 'john.tech@company.com', 'John Tech')} class="p-3 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 text-left transition">
                                <span class="font-bold text-slate-800 block">Tech Agent</span>
                                <span class="text-slate-400 text-[11px]">john.tech@company.com</span>
                            </button>
                            <button onClick={() => handleLogin('CUSTOMER', 'alice.smith@example.com', 'Alice Smith')} class="p-3 border border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 text-left transition">
                                <span class="font-bold text-slate-800 block">Customer</span>
                                <span class="text-slate-400 text-[11px]">alice.smith@example.com</span>
                            </button>
                        </div>
                    </div>
                </div>
            );

        function PriorityBadge({ priority }) {
            const colors = {

                HIGH: 'bg-orange-50 text-orange-700 border-orange-200',
                MEDIUM: 'bg-blue-50 text-blue-700 border-blue-200',
                LOW: 'bg-slate-100 text-slate-600 border-slate-200'
            };
            return (
                <span class={`px-2.5 py-0.5 text-[11px] font-bold rounded-full border ${colors[priority] || colors.MEDIUM}`}>
                    {priority}
                </span>
            );
        }

        function StatusBadge({ status }) {
            const colors = {
                NEW: 'bg-sky-50 text-sky-700 border-sky-200',
                ASSIGNED: 'bg-purple-50 text-purple-700 border-purple-200',
                IN_PROGRESS: 'bg-amber-50 text-amber-700 border-amber-200',
                WAITING_FOR_CUSTOMER: 'bg-cyan-50 text-cyan-700 border-cyan-200',
                RESOLVED: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                CLOSED: 'bg-slate-100 text-slate-700 border-slate-200'
            };
            return (
                <span class={`px-2.5 py-0.5 text-[11px] font-bold rounded-full border ${colors[status] || colors.NEW}`}>
                    {status ? status.replace(/_/g, ' ') : 'NEW'}
                </span>
            );

        function SlaBadge({ breached, remaining }) {
            if (breached) return <span class="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-red-100 text-red-800 border border-red-300">SLA BREACHED</span>;
            if (remaining !== undefined && remaining < 180) return <span class="px-2.5 py-0.5 text-[11px] font-bold rounded-full bg-amber-100 text-amber-800 border border-amber-300">Approaching ({Math.max(0, Math.floor(remaining/60))}h)</span>;

            const [priority, setPriority] = useState('MEDIUM');

            const handleSubmit = (e) => {
                e.preventDefault();
                const newId = "CMP-2026-0000" + Math.floor(21 + Math.random()*80);
                const newTicket = {
                    id: Date.now(),
                    ticketNumber: newId,
                    customerName: name,
                    customerEmail: email,
                    customerPhone: phone,
                    subject: subject,
                    description: description,
                    category: category,
                    priority: priority,
                    status: 'NEW',
                    departmentName: category === 'PAYMENT' ? 'Finance' : category === 'BILLING' ? 'Billing' : 'Technical Support',
                    assignedAgentName: 'John Tech',
                    createdAt: 'Just Now',
                    slaRemainingMinutes: priority === 'CRITICAL' ? 240 : 2880,
                    slaBreached: false
                };
                setComplaints(prev => [newTicket, ...prev]);
                showToast(`Ticket ${newId} registered successfully!`);
                setActiveTab('complaints');
            };

            return (
                <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
                    <h2 class="text-xl font-bold text-slate-800 mb-1">Register Customer Complaint</h2>
                    <p class="text-xs text-slate-500 mb-6">Submit a new complaint ticket into the database.</p>

                    <form onSubmit={handleSubmit} class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Customer Full Name *</label>
                                <input required type="text" value={name} onChange={e => setName(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500" placeholder="e.g. John Doe" />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Customer Email *</label>
                                <input required type="email" value={email} onChange={e => setEmail(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500" placeholder="john@example.com" />
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Phone</label>
                                <input type="text" value={phone} onChange={e => setPhone(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500" placeholder="+1-555-0100" />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Category</label>
                                <select value={category} onChange={e => setCategory(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-white">
                                    <option value="PAYMENT">Payment</option>
                                    <option value="BILLING">Billing</option>
                                    <option value="TECHNICAL">Technical</option>
                                    <option value="SERVICE_QUALITY">Service Quality</option>
                                    <option value="DELIVERY_LOGISTICS">Logistics</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Priority</label>
                                <select value={priority} onChange={e => setPriority(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs bg-white">
                                    <option value="LOW">LOW (72h)</option>
                                    <option value="MEDIUM">MEDIUM (48h)</option>
                                    <option value="HIGH">HIGH (24h)</option>
                                    <option value="CRITICAL">CRITICAL (4h)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Complaint Subject *</label>
                            <input required type="text" value={subject} onChange={e => setSubject(e.target.value)} class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500" placeholder="Brief subject..." />
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Detailed Description *</label>
                            <textarea required rows="4" value={description} onChange={e => setDescription(e.target.value)} class="w-full p-3 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500" placeholder="Description details..."></textarea>
                        </div>

                        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition shadow-sm">
                            Add Ticket to Database
                        </button>
                    </form>
                </div>
            );
        }

        // OTHER VIEWS
        function EmailCenterView({ showToast }) {
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-base">Email-to-Ticket Mailbox Monitor</h3>
                    <p class="text-xs text-slate-500">Monitored Support Email: <span class="font-mono text-blue-600 font-bold">support@company.com</span></p>
                    <div class="p-4 bg-slate-50 rounded-xl text-xs text-slate-600">
                        Inbound email ingestion service active. Automatic ticket matching against CMP-2026-XXXXXX regex pattern enabled.
                    </div>
                </div>
            );
        }

        function AgentManagementView() {
            const agents = [
                { name: "John Tech", email: "john.tech@company.com", dept: "Technical Support", tickets: 6 },
                { name: "Sarah Finance", email: "sarah.fin@company.com", dept: "Finance", tickets: 4 },
                { name: "Mike Billing", email: "mike.billing@company.com", dept: "Billing", tickets: 4 },
                { name: "Emily Care", email: "emily.care@company.com", dept: "Logistics & Care", tickets: 6 }
            ];
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">Support Agent Workload Roster</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {agents.map((a,i) => (
                            <div key={i} class="p-4 border border-slate-200 rounded-xl flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-sm">
                                        {a.name.substring(0,2)}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-sm">{a.name}</h4>
                                        <p class="text-xs text-slate-400">{a.email} • {a.dept}</p>
                                    </div>
                                </div>
                                <span class="px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-full">{a.tickets} Active Tickets</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function DepartmentManagementView() {
            const deps = [
                { name: "Technical Support", head: "tech.head@company.com", desc: "Software, app crashes & system outages" },
                { name: "Finance", head: "fin.head@company.com", desc: "Payment deductions & refunds" },
                { name: "Billing", head: "billing.head@company.com", desc: "Invoices, tax calculations & subscriptions" },
                { name: "Logistics", head: "logistics.head@company.com", desc: "Shipping delays & damaged packages" },
                { name: "Customer Care", head: "care.head@company.com", desc: "Service quality & general inquiries" }
            ];
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">Departmental Registry</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        {deps.map((d,i) => (
                            <div key={i} class="p-4 border border-slate-200 rounded-xl space-y-2">
                                <h4 class="font-bold text-slate-800">{d.name}</h4>
                                <p class="text-xs text-slate-500">{d.desc}</p>
                                <div class="text-[11px] font-mono text-blue-600 font-bold">{d.head}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SlaManagementView() {
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">Service Level Agreement (SLA) Matrix</h3>
                    <div class="space-y-3">
                        <div class="p-4 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                            <div><span class="font-bold text-red-600 text-sm block">CRITICAL PRIORITY</span>System outages, payment deducted without order</div>
                            <span class="font-bold text-blue-600 text-sm">4 Hours SLA Target</span>
                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                            <div><span class="font-bold text-orange-600 text-sm block">HIGH PRIORITY</span>Severe bugs, shipping delays, billing errors</div>
                            <span class="font-bold text-blue-600 text-sm">24 Hours SLA Target</span>
                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                            <div><span class="font-bold text-blue-600 text-sm block">MEDIUM PRIORITY</span>Standard feature issues, invoice tax inquiries</div>
                            <span class="font-bold text-blue-600 text-sm">48 Hours SLA Target</span>
                        </div>
                        <div class="p-4 border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                            <div><span class="font-bold text-slate-600 text-sm block">LOW PRIORITY</span>General feedback & cosmetic suggestions</div>
                            <span class="font-bold text-blue-600 text-sm">72 Hours SLA Target</span>
                        </div>
                    </div>
                </div>
            );
        }

        function EscalationManagementView({ complaints, setSelectedComplaint, setActiveTab }) {
            const escalated = complaints.filter(c => c.slaBreached || c.escalated);
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg text-red-600 flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-5 h-5"></i> Escalated & SLA-Breached Complaints ({escalated.length})
                    </h3>
                    <div class="space-y-3">
                        {escalated.map(c => (
                            <div key={c.id} class="p-4 border border-red-200 bg-red-50/50 rounded-xl flex items-center justify-between">
                                <div>
                                    <span class="font-mono font-bold text-red-700 text-sm">{c.ticketNumber}</span>
                                    <h4 class="font-bold text-slate-800 text-sm">{c.subject}</h4>
                                    <p class="text-xs text-red-600 font-medium">{c.escalationReason || 'SLA resolution deadline exceeded'}</p>
                                </div>
                                <button onClick={() => { setSelectedComplaint(c); setActiveTab('complaint-details'); }} class="px-4 py-2 bg-red-600 text-white font-bold text-xs rounded-xl shadow-sm">
                                    Supervisor Action
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ReportsView() {
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">Resolution Performance & CSAT Analytics</h3>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div class="p-4 bg-slate-50 rounded-xl">
                            <span class="text-xs text-slate-500 font-bold uppercase">SLA Compliance Rate</span>
                            <div class="text-2xl font-black text-emerald-600 mt-1">90.0%</div>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl">
                            <span class="text-xs text-slate-500 font-bold uppercase">Avg Resolution Time</span>
                            <div class="text-2xl font-black text-blue-600 mt-1">16.4 hrs</div>
                        </div>
                        <div class="p-4 bg-slate-50 rounded-xl">
                            <span class="text-xs text-slate-500 font-bold uppercase">Customer CSAT</span>
                            <div class="text-2xl font-black text-amber-500 mt-1">4.8 / 5.0</div>
                        </div>
                    </div>
                </div>
            );
        }

        function CustomerFeedbackView({ showToast }) {
            const feedbacks = [
                { name: "Alice Smith", ticket: "CMP-2026-000001", rating: 5, comment: "Excellent and fast refund resolution by Sarah! The refund reflected in 2 hours." },
                { name: "James Wilson", ticket: "CMP-2026-000007", rating: 4, comment: "Replacement item shipped promptly." },
                { name: "Daniel Taylor", ticket: "CMP-2026-000009", rating: 5, comment: "Tax exemption invoice updated correctly." },
                { name: "Matthew Thomas", ticket: "CMP-2026-000013", rating: 5, comment: "Great security action resetting account credentials." }
            ];

            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">Customer CSAT Feedback Reviews</h3>
                    <div class="space-y-3">
                        {feedbacks.map((f, i) => (
                            <div key={i} class="p-4 border border-slate-100 rounded-xl text-xs space-y-1">
                                <div class="flex justify-between">
                                    <span class="font-bold text-slate-800">{f.name} ({f.ticket})</span>
                                    <span class="text-amber-500 font-bold">{"★".repeat(f.rating)}</span>
                                </div>
                                <p class="text-slate-600">{f.comment}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function SystemSettingsView() {
            return (
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">System Configurations</h3>
                    <div class="p-4 bg-slate-50 rounded-xl text-xs text-slate-600 space-y-1">
                        <p><strong>SMTP Mail Host:</strong> smtp.gmail.com:587</p>
                        <p><strong>Monitored Support Email:</strong> support@company.com</p>
                        <p><strong>Database:</strong> H2 In-Memory / PostgreSQL (20 Complaints loaded)</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);

        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 500);
    </script>
</body>
</html>
