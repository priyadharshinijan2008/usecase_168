# Smart Customer Complaint System - Configuration

spring.application.name=smart-complaint-system
server.port=8080

# Database Configuration (H2 in-memory mode with persistent file fallback)
spring.datasource.url=jdbc:h2:mem:complaintdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
jwt.secret=9a4f2c8d7e1b5a3f6c8e0d2b4a6f8c1e3b5a7d9f2c4e6b8a0d2f4c6e8b0a2d4f
jwt.expiration=86400000

# Mail Configuration (Support Email & Simulated / Live SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=support@company.com
spring.mail.password=mock_smtp_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
